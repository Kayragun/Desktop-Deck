[package]
name = "desktop-deck"
version = "0.1.0"
edition = "2021"
description = "Desktop Deck - Lightweight Desktop Widget"

[[bin]]
name = "desktop-deck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
