[package]
name = "desktop-deck"
version = "0.1.1"
edition = "2021"
description = "Desktop Deck - Lightweight Desktop Widget"

[[bin]]
name = "desktop-deck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
# direct dep: the interface macro expands to ::windows_core paths
windows-core = "0.58"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
